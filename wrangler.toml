name = "reprox"
main = "src/index.ts"
compatibility_date = "2026-10-27"

# Environment variables (set via wrangler secret)
# GPG_PRIVATE_KEY - ASCII armored private key for signing
# GITHUB_TOKEN - GitHub PAT for API rate limits (optional but recommended)

[vars]
# Default cache TTL in seconds (24 hours)
CACHE_TTL = "86400"

# Parsed package headers, shared by every colo. Created on first deploy.
[[kv_namespaces]]
binding = "ENTRIES"

[placement]
mode = "smart"

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1
